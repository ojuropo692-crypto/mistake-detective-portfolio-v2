<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>词义诊断 · 错题本</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ececec;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 0 40px;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      color: #333333;
    }

    .phone {
      width: 393px;
      height: 852px;
      background: #ffffff;
      padding: 29px 24px 0;
      flex-shrink: 0;
    }

    .title {
      margin: 0 0 20px;
      font-size: 24px;
      line-height: 32px;
      font-weight: 400;
      color: #333333;
      background: none;
      border: 0;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      position: relative;
      background: #f5f6f8;
      border-radius: 12px;
      padding: 16px 16px 18px;
      transition: box-shadow 0.15s ease;
      display: block;
      text-decoration: none;
    }

    .card:hover {
      box-shadow: inset 0 0 0 1px #d8dbe0;
    }

    .word {
      margin: 0 0 8px;
      padding-right: 88px;
      font-size: 24px;
      line-height: 32px;
      font-weight: 700;
      color: #333333;
    }

    .meta {
      margin: 0;
      font-size: 16px;
      line-height: 24px;
      color: #888888;
    }

    .meta + .meta {
      margin-top: 4px;
    }

    .tag {
      position: absolute;
      top: 16px;
      right: 16px;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 20px;
      font-weight: 400;
      color: #333333;
      white-space: nowrap;
    }

    .tag-pending { background: #d4a5b5; }
    .tag-helped { background: #f7dfa5; }
    .tag-mastered { background: #d6e8fb; }
  </style>
</head>
<body>
  <main class="phone">
    <h1 class="title">我的错题本</h1>

    <div class="list">
      <a href="practice.html" class="card">
        <span class="tag tag-pending">仍待验证</span>
        <h2 class="word">clever</h2>
        <p class="meta">卡点：词义混淆 · 提示 L2</p>
        <p class="meta">复核：D+1/D+7</p>
      </a>

      <article class="card">
        <span class="tag tag-helped">帮助完成</span>
        <h2 class="word">polite</h2>
        <p class="meta">卡点：拼写 · L3</p>
        <p class="meta">复核：D+1</p>
      </article>

      <a href="diagnosis-report.html" class="card">
        <span class="tag tag-mastered">已掌握</span>
        <h2 class="word">quiet</h2>
        <p class="meta">卡点：无 · 独立通过</p>
        <p class="meta">减练：3题</p>
      </a>
    </div>
  </main>
</body>
</html>
